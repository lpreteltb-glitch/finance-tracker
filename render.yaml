services:
  - type: web
    name: finance-tracker
    runtime: docker
    plan: free
    healthCheckPath: /api/categories
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false # optional; Render asks for the value at deploy time
      - key: PLAID_CLIENT_ID
        sync: false # from dashboard.plaid.com → Developers → Keys (Sandbox)
      - key: PLAID_SECRET
        sync: false
